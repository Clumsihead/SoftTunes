name: Build APK and draft a release

# Runs when you push a version tag (release.bat does this for you),
# or manually: Actions tab -> "Build APK and draft a release" -> Run workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.0.0"
        required: true
        default: "v0.0.1"

permissions:
  contents: write   # needed to create the draft release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a matching Python on the build machine to install yt-dlp / av.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # GitHub's ubuntu runners already include the Android SDK (ANDROID_HOME).
      # Just accept the licences so Gradle can fetch anything it is missing.
      - name: Accept Android SDK licences
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      # No Gradle wrapper in the repo, so install Gradle directly (AGP 8.5 needs 8.7+).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Use your signing key if you added one (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with your release keystore."
          else
            echo "No KEYSTORE_BASE64 secret found; signing with a throwaway debug key."
          fi

      - name: Build release APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export APP_VERSION="${TAG#v}"
          gradle assembleRelease --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "SoftTunes-${TAG}.apk"

      - name: Create draft release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: SoftTunes ${{ env.TAG }}
          draft: true
          generate_release_notes: true
          files: SoftTunes-${{ env.TAG }}.apk
          fail_on_unmatched_files: true

      - name: Also keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoftTunes-${{ env.TAG }}
          path: SoftTunes-${{ env.TAG }}.apk

      - name: Upload build reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/outputs/logs
          if-no-files-found: ignore
